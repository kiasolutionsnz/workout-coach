name: Upload approved offline beta to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unused build number for version 0.1.0 (increment after each upload)'
        required: true
        default: '1'
permissions:
  contents: read
  actions: read
concurrency:
  group: workout-testflight-upload
  cancel-in-progress: false
jobs:
  sign-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BETA_BUILD_NUMBER: ${{ inputs.build_number }}
      TESTFLIGHT_PRIVACY_READY: ${{ vars.TESTFLIGHT_PRIVACY_READY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require passing native verification at this revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          if os.environ['TESTFLIGHT_PRIVACY_READY'] != 'true':
              raise SystemExit('Resolve SDK privacy/consent and declarations before enabling TestFlight upload.')
          if not re.fullmatch(r'[0-9]{1,4}(\.[0-9]{1,2}){0,2}', os.environ['BETA_BUILD_NUMBER']):
              raise SystemExit('Invalid build number.')
          for workflow in ('build.yml', 'ios-device.yml'):
              endpoint = 'repos/' + os.environ['GH_REPO'] + '/actions/workflows/' + workflow + '/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&status=completed&per_page=20'
              data = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
              if not any(run['conclusion'] == 'success' and run['head_branch'] == 'main' for run in data['workflow_runs']):
                  raise SystemExit('Run ' + workflow + ' successfully at this exact revision before uploading.')
          PY
          python3 scripts/check_repository.py
          python3 scripts/check_model_assets.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.3.1"
      - name: Install approved signing configuration
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/configure_testflight_signing.py
      - name: Build offline release workspace
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace
          python3 scripts/prepare_ios_device_project.py
          brew install xcodegen
          xcodegen generate --spec iosApp/project-device.generated.yml --project iosApp
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          cd iosApp
          pod install
      - name: Archive and export signed offline app
        run: |
          xcodebuild archive -workspace iosApp/WorkoutCoach.xcworkspace -scheme WorkoutCoach -configuration Release -destination 'generic/platform=iOS' -archivePath iosApp/build/WorkoutCoach.xcarchive CURRENT_PROJECT_VERSION="$BETA_BUILD_NUMBER"
          xcodebuild -exportArchive -archivePath iosApp/build/WorkoutCoach.xcarchive -exportPath iosApp/build/export -exportOptionsPlist "$RUNNER_TEMP/workout-testflight/ExportOptions.plist"
          python3 - <<'PY'
          import plistlib, subprocess
          from pathlib import Path
          app = Path('iosApp/build/WorkoutCoach.xcarchive/Products/Applications/WorkoutCoach.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'tech.kiasolutions.workoutcoach'
          assert info['WORKOUT_OFFLINE_BETA'] in (True, 'YES', 'true', '1')
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          assert Path('iosApp/build/export/WorkoutCoach.ipa').is_file()
          PY
      - name: Upload to the approved App Store Connect app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd "$RUNNER_TEMP/workout-testflight"
          xcrun altool --upload-app --file "$GITHUB_WORKSPACE/iosApp/build/export/WorkoutCoach.ipa" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing inputs
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'workout-testflight'
          keychain = folder / 'signing.keychain-db'
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          uuid = os.environ.get('WORKOUT_PROFILE_UUID', '')
          if re.fullmatch(r'[A-Fa-f0-9-]{36}', uuid):
              (Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (uuid + '.mobileprovision')).unlink(missing_ok=True)
          if folder.exists():
              shutil.rmtree(folder)
          PY
