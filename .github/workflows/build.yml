name: Public mobile verification
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  public-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan full public history and validate model assets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner
          python3 scripts/check_repository.py
          python3 scripts/check_model_assets.py
  android:
    needs: public-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tracked credential guard
        run: python3 scripts/check_repository.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.3.1"
      - name: Compile Android and shared tests
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --stacktrace
      - name: Verify exported workout schema
        run: python3 scripts/check_history_export.py
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android emulator instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 7
          name: android-foundation-evidence
          path: |
            **/build/reports/
            androidApp/build/outputs/apk/debug/
  ios:
    needs: public-source-checks
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.3.1"
      - name: Record Xcode and simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and test Kotlin iOS framework
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generate native SwiftUI project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml --project iosApp
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          cd iosApp
          pod install
      - name: Native iOS simulator UI smoke test
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcodebuild test -workspace iosApp/WorkoutCoach.xcworkspace -scheme WorkoutCoach -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath iosApp/build/Foundation.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Export native UI attachments
        if: always()
        run: |
          if [ -d iosApp/build/Foundation.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/Foundation.xcresult --output-path iosApp/build/attachments
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 7
          name: ios-foundation-evidence
          path: |
            shared/build/reports/
            iosApp/build/attachments/
            iosApp/Podfile.lock
